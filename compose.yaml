services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AUDIO_ENGINE_HOST: audio-engine
      AUDIO_ENGINE_PORT: "57120"
      SONG_DURATION_SECONDS: "209.797149"
      SONG_BPM: "114"
      AUDIO_PREBUFFER_SECONDS: "3"
      LYRICS_PATH: /app/lyrics.word-timed.json
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  audio-engine:
    build: ./audio-engine
    environment:
      BACKEND_INGEST_URL: http://backend:8000/internal/audio
    volumes:
      - ./tracks/never-gonna-give-you-up:/music:ro
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - SYS_NICE
    shm_size: 256m
    ulimits:
      memlock: -1
      rtprio: 99
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "/"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
