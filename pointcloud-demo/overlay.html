<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Point Cloud Overlay</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  #media-layer { z-index: 0; opacity: 1; }
  #person-layer { z-index: 1; pointer-events: auto; mix-blend-mode: multiply; }
</style>
</head>
<body>
  <iframe id="media-layer" src="./background-flat.html" title="Media point cloud"></iframe>
  <iframe
    id="person-layer"
    src="./index.html"
    title="Live person point cloud"
    allow="camera; microphone"
  ></iframe>
</body>
</html>
