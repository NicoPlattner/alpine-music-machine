<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flat Image Point Cloud</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  #scene { display: block; width: 100vw; height: 100vh; }
  #source { display: none; }
  #playBtn {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.55);
    color: #fff;
    font: 500 14px system-ui, sans-serif;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #playBtn:hover { background: rgba(0,0,0,0.75); }
  #playBtn[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<img id="source" src="./Mountains.jpeg" alt="" />
<audio id="track" src="./track.mp3" loop preload="auto"></audio>
<button id="playBtn">▶ Play music</button>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";

const COLS = 1350;
const ROWS = 975;
const POINT_SIZE = 1.2;
const IMAGE_CONTRAST = 2.2;
const IMAGE_URL = "./flechte.jpeg";
const AUDIO_DISTORTION = 3;
const AUDIO_THRESHOLD = 0.5;
const WAVE_AMPLITUDE = 0.22;
const WAVE_FREQUENCY = 1.6;
const WAVE_SPEED = 0.3;
const WAVE_FREQUENCY_2 = 0.9;
const WAVE_SPEED_2 = 0.17;
const PARALLAX_STRENGTH = 0.3;

const canvas = document.getElementById("scene");
const source = document.getElementById("source");
const track = document.getElementById("track");
const playBtn = document.getElementById("playBtn");
let audioAnalyser;
let audioData;
let smoothedBeat = 0;
let smoothedLevel = 0;
let isPlaying = false;

track.addEventListener("play", () => { isPlaying = true; });
track.addEventListener("pause", () => { isPlaying = false; });
track.addEventListener("ended", () => { isPlaying = false; });

function initAudio() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;
  const audioContext = new AudioContextClass();
  audioAnalyser = audioContext.createAnalyser();
  audioAnalyser.fftSize = 512;
  audioAnalyser.smoothingTimeConstant = 0.85;
  audioData = new Uint8Array(audioAnalyser.frequencyBinCount);

  const trackSource = audioContext.createMediaElementSource(track);
  trackSource.connect(audioAnalyser);
  audioAnalyser.connect(audioContext.destination);

  function tryPlay() {
    audioContext.resume();
    track.play().then(() => {
      playBtn.hidden = true;
    }).catch(() => {
      playBtn.hidden = false;
    });
  }

  playBtn.addEventListener("click", tryPlay);
  tryPlay();
}

function updateAudio() {
  if (!audioAnalyser || !audioData) return 0;
  audioAnalyser.getByteFrequencyData(audioData);

  let sum = 0;
  for (let i = 0; i < audioData.length; i++) sum += audioData[i];
  const level = sum / (audioData.length * 255);
  smoothedLevel += (level - smoothedLevel) * 0.06;

  const bassBins = Math.max(1, Math.floor(audioData.length * 0.12));
  let bass = 0;
  for (let i = 0; i < bassBins; i++) bass += audioData[i];
  bass /= bassBins * 255;
  bass = Math.max(0, (bass - AUDIO_THRESHOLD) / (1 - AUDIO_THRESHOLD));
  smoothedBeat += (bass - smoothedBeat) * 0.09;
  return Math.min(1, smoothedBeat * AUDIO_DISTORTION);
}

function createPointCloud(texture, aspect) {
  const positions = new Float32Array(COLS * ROWS * 3);
  const uvs = new Float32Array(COLS * ROWS * 2);
  const cameraDistance = 2.4;
  const cameraFov = 50;
  const viewportAspect = window.innerWidth / window.innerHeight;
  const visibleHeight = 2 * cameraDistance * Math.tan(THREE.MathUtils.degToRad(cameraFov / 2));
  const worldHeight = Math.max(visibleHeight, visibleHeight * viewportAspect / aspect) * 1.04;
  const worldWidth = worldHeight * aspect;
  let index = 0;

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const u = col / (COLS - 1);
      const v = row / (ROWS - 1);
      positions[index * 3] = (u - 0.5) * worldWidth;
      positions[index * 3 + 1] = (0.5 - v) * worldHeight;
      positions[index * 3 + 2] = 0;
      uvs[index * 2] = u;
      uvs[index * 2 + 1] = 1 - v;
      index++;
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));

  const material = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    uniforms: {
      uTexture: { value: texture },
      uPointSize: { value: POINT_SIZE },
      uContrast: { value: IMAGE_CONTRAST },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
      uAudioBeat: { value: 0 },
      uWaveLevel: { value: 0 },
      uWaveAmplitude: { value: WAVE_AMPLITUDE },
      uTime: { value: 0 },
    },
    vertexShader: `
      uniform sampler2D uTexture;
      uniform float uPointSize;
      uniform float uContrast;
      uniform float uPixelRatio;
      uniform float uAudioBeat;
      uniform float uWaveLevel;
      uniform float uWaveAmplitude;
      uniform float uTime;
      out vec3 vColor;
      void main() {
        vec3 color = texture(uTexture, uv).rgb;
        color = clamp((color - 0.5) * uContrast + 0.5, 0.0, 1.0);
        vec3 position3d = position;
        float luminance = dot(color, vec3(0.299, 0.587, 0.114));
        position3d.z = (luminance - 0.5) * 0.18;

        // Points that sit closer to the camera (brighter pixels, positive z)
        // animate on a faster clock than points further back, so the wave's
        // motion visibly separates into depth layers instead of moving as one
        // flat sheet.
        float depthFactor = luminance - 0.5;
        float parallaxTime = uTime * (1.0 + depthFactor * ${PARALLAX_STRENGTH.toFixed(2)});

        // Two broad, screen-wide sine waves (different wavelength/speed) summed
        // together and scrolled over time, so the whole picture rolls like a
        // smooth swell instead of jittering per point. Amplitude tracks overall
        // music loudness and bass hits.
        float wave1 = sin(uv.x * ${WAVE_FREQUENCY.toFixed(2)} * 6.2831853 - parallaxTime * ${WAVE_SPEED.toFixed(2)});
        float wave2 = sin(uv.x * ${WAVE_FREQUENCY_2.toFixed(2)} * 6.2831853 - parallaxTime * ${WAVE_SPEED_2.toFixed(2)} + 1.7);
        float waveShape = wave1 * 0.65 + wave2 * 0.35;
        float amplitude = uWaveAmplitude * clamp(uWaveLevel * 2.5, 0.0, 1.0) * (0.5 + uAudioBeat * 0.7);
        position3d.y += waveShape * amplitude;
        position3d.z += waveShape * amplitude * 0.4;

        vec4 mvPosition = modelViewMatrix * vec4(position3d, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = uPointSize * uPixelRatio * (4.0 / -mvPosition.z) * (1.0 + uAudioBeat * 0.08);
        vColor = color;
      }
    `,
    fragmentShader: `
      precision highp float;
      in vec3 vColor;
      out vec4 fragColor;
      void main() {
        vec2 point = gl_PointCoord - vec2(0.5);
        if (dot(point, point) > 0.25) discard;
        fragColor = vec4(vColor, 1.0);
      }
    `,
  });

  return new THREE.Points(geometry, material);
}

function start() {
  const texture = new THREE.Texture(source);
  texture.needsUpdate = true;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setClearColor(0x000000, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 50);
  camera.position.set(0, 0, 2.4);
  const pointCloud = createPointCloud(texture, source.naturalWidth / source.naturalHeight);
  scene.add(pointCloud);
  initAudio();

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }

  window.addEventListener("resize", resize);
  let frameCount = 0;
  function render() {
    requestAnimationFrame(render);
    pointCloud.material.uniforms.uTime.value += 0.016;
    const beat = updateAudio();
    pointCloud.material.uniforms.uAudioBeat.value = isPlaying ? beat : 0;
    pointCloud.material.uniforms.uWaveLevel.value = isPlaying ? smoothedLevel : 0;
    renderer.render(scene, camera);

    // Broadcast playback time to the parent page (overlay.html) so it can
    // drive karaoke-style captions. Throttled since lyric sync doesn't need
    // per-frame precision.
    frameCount++;
    if (frameCount % 6 === 0) {
      window.parent.postMessage({
        type: "wolp-audio-time",
        currentTime: track.currentTime,
        duration: track.duration,
        isPlaying,
      }, "*");
    }
  }
  render();
}

if (source.complete) start();
else source.addEventListener("load", start, { once: true });
</script>
</body>
</html>
